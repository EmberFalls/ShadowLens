<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShadowLens settings</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><span class="mark">S</span><div><h1>ShadowLens settings</h1><p>Credentials stay in extension session storage and are never placed in this page's markup.</p></div></header><section><h2>Device connection</h2><label for="credential">Device credential</label><input id="credential" type="password" autocomplete="off" spellcheck="false"><button id="connect" type="button">Connect</button><p id="status" role="status" aria-live="polite">Not connected</p></section><section><h2>Protection coverage</h2><p>Only the local ShadowLens sandbox is guarded. Other sites are observed only when supported and are not protected by this build.</p></section></main><script src="options.js"></script></body></html>

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowshield-api"
version = "0.1.0"
description = "Local FastAPI service for the ShadowShield demonstration"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.3",
  "uvicorn==0.34.0",
  "cryptography==50.0.2",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==8.4.2",
]

[project.scripts]
shadowshield-api = "shadow_api.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["shadow_api*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../.."]
addopts = "-ra"
